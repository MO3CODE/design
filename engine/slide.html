<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<!-- محرك شرائح بوابة المستثمر — يرسم شريحة واحدة من spec عبر window.render(data). يستدعيه scripts/render.js -->
<style id="fontcss"></style>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#111;overflow:hidden}
.canvas{position:relative;overflow:hidden;width:var(--W);height:var(--H);background:var(--bg);color:var(--ink);
  font-family:var(--ff),'Plex',sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"kern" 1;}
.layer{position:absolute;inset:0;pointer-events:none}

/* ── الخلفية والخامات ── */
.base{background:var(--base)}
.glow{background:var(--glow)}
.motif{background:var(--motif);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;opacity:var(--motifOp)}
.tex{background-image:var(--tex);background-size:512px 512px;mix-blend-mode:soft-light;opacity:var(--texOp)}
.mottle{background-image:var(--mottle);background-size:900px 900px;mix-blend-mode:soft-light;opacity:var(--mottleOp)}
.vign{background:radial-gradient(130% 110% at 50% 45%,transparent 55%,var(--vign) 100%);mix-blend-mode:multiply}
.grain{background-image:var(--grain);background-size:256px 256px;mix-blend-mode:overlay;opacity:var(--grainOp);z-index:50}

/* ── الصورة ── */
.photo{position:absolute;background-size:cover;background-repeat:no-repeat}
.cutout{position:absolute;background-size:contain;background-repeat:no-repeat;background-position:bottom center;
  filter:drop-shadow(0 18px 22px rgba(40,28,10,.28)) drop-shadow(0 3px 4px rgba(40,28,10,.25))}
.cut-shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(45,32,14,.38),transparent);filter:blur(6px)}

/* ── الشعار والتنقل ── */
.logo{position:absolute;z-index:20;background-repeat:no-repeat;background-size:contain;background-position:center}
.swipe{position:absolute;z-index:20;display:flex;align-items:center;gap:10px;direction:rtl;color:var(--ink);opacity:.92}
.swipe .t{font-size:24px;font-weight:600}
.swipe i{font-size:54px;line-height:1}

/* ── المحتوى ── */
.content{position:absolute;z-index:10;display:flex;flex-direction:column;align-items:flex-start;--k:1}
.content.v-center{justify-content:center}.content.v-bottom{justify-content:flex-end}.content.v-top{justify-content:flex-start}
.content.al-center{align-items:center;text-align:center}
.content > *{flex-shrink:0}
.title,.h2,.bar,.bign,.pt-h,.panel .pl,.cmp .col h3,.steps .st,.blk .lb,.tagbox,.before .bh,.track .th{font-family:var(--ffH),var(--ff)}
.title{font-weight:var(--wTitle);line-height:1.32;letter-spacing:0;color:var(--ink);font-size:calc(var(--k)*var(--fs)*1px)}
.title .ln{display:block;white-space:nowrap}
.acc{color:var(--accent)}
.lt{font-weight:300}
.mark{background:var(--markBg);color:var(--markInk);padding:0 .18em .04em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* شريط لاصق (tape) — حواف ممزّقة وميلان بسيط، زي مرجع باكمان */
.tape .mark{display:inline-block;border-radius:0;padding:.02em .32em .1em;transform:rotate(-1.4deg);-webkit-text-fill-color:var(--markInk);
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%,rgba(0,0,0,.08)),var(--markBg);
  clip-path:polygon(0 4%,3% 0,6% 6%,9% 1%,100% 0,98% 18%,100% 34%,97% 52%,100% 70%,98% 86%,100% 100%,7% 98%,4% 100%,1% 94%,2% 76%,0 58%,2% 40%,0 22%);
  box-shadow:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
/* نص ذهبي معدني للكلمة المميزة بالثيمات الداكنة */
.gold .acc,.gold .stat .n,.gold .ig-n{background:linear-gradient(180deg,#F8E6BF 0%,#E2C38E 38%,#C29D61 62%,#E9D3A3 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.frames path{fill:none;stroke:var(--motif);stroke-width:2.2;opacity:var(--motifOp)}
/* خريطة */
.mapwrap{position:absolute;z-index:5;pointer-events:none}
.mapwrap svg{width:100%;height:100%;overflow:visible}
.pin-l{font-weight:700;fill:var(--ink)}
.foot-block{position:absolute;z-index:11;display:flex;flex-direction:column;gap:12px;--k:1}
.source{position:absolute;z-index:11;font-size:20px;font-weight:600;color:var(--sub);opacity:.85}
/* إنفوجرافيك */
.ig{display:grid;grid-template-columns:1fr var(--cw,320px) 1fr;align-self:stretch;flex:1;min-height:0;direction:rtl}
.ig .col{display:flex;flex-direction:column;justify-content:space-around;gap:20px}
.ig .col.l{align-items:flex-start}.ig .col.r{align-items:flex-start}
.ig-stat .row{display:flex;align-items:baseline;gap:12px;direction:rtl}
.ig-n{font-weight:900;font-size:calc(var(--k)*var(--fsn,104px));line-height:.95;color:var(--ink);direction:ltr;font-family:var(--ffNum),var(--ff)}
.ig-u{display:inline-block;background:var(--pillBg);color:var(--pillInk);font-weight:800;font-size:calc(var(--k)*24px);padding:.15em .55em .2em;border-radius:6px}
.ig-l{font-size:calc(var(--k)*25px);color:var(--sub);margin-top:8px;line-height:1.4;font-weight:600}
.ig-items{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ig-it{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--cardEdge);border-radius:12px;padding:8px 14px;font-size:calc(var(--k)*23px);color:var(--ink);font-weight:600}
.ig-it b{font-family:var(--ffNum),var(--ff);font-weight:800;font-size:calc(var(--k)*30px);direction:ltr;color:var(--accent)}
/* عجلة الخدمات */
.wheel{position:absolute;z-index:6}
.wheel .seg-t{position:absolute;transform:translate(-50%,-50%);text-align:center;font-weight:800;color:var(--segInk);line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:8px}
.wheel .seg-t i{font-size:46px;opacity:.9}
/* ═ بوستر إنفوجرافيك ═ */
.hero{position:absolute;left:0;right:0;top:0;z-index:4;overflow:hidden}
.hero .hp{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-t{position:absolute;z-index:12;display:flex;flex-direction:column;--k:1}
.tagbox{display:inline-block;background:var(--pillBg);color:var(--pillInk);font-weight:800;font-size:calc(var(--k)*34px);padding:.08em .5em .16em;line-height:1.3}
.sec{align-self:stretch}
.sec + .sec{margin-top:calc(var(--k)*var(--sgap,34px))}
.bign{font-weight:900;font-size:calc(var(--k)*170px);line-height:.9;color:var(--accentDeep,var(--accent));font-family:var(--ffNum),var(--ff)}
.pts{display:flex;flex-direction:column;gap:calc(var(--k)*26px)}
.pt-h{display:flex;align-items:center;gap:14px;font-weight:800;font-size:calc(var(--k)*44px);color:var(--accent);line-height:1.2}
.pt-h:before{content:"";width:22px;height:6px;border-radius:3px;background:var(--accent);flex:0 0 auto}
.pt-t{font-size:calc(var(--k)*27px);line-height:1.6;color:var(--sub);margin-top:4px}
.aside{background:var(--card);border:1.5px solid var(--cardEdge);box-shadow:var(--cardShadow);border-radius:6px;padding:0 0 26px;text-align:center;overflow:hidden}
.aside .ah{background:var(--pillBg);color:var(--pillInk);font-weight:800;font-size:calc(var(--k)*28px);padding:12px;margin:-1px -1px 22px}
.aside .at{font-size:calc(var(--k)*27px);line-height:1.7;color:var(--ink);padding:0 26px;text-align:center}
.aside .qr{width:190px;height:190px;margin:22px auto 10px;background-size:contain;border-top:2px solid var(--accent);padding-top:18px;background-origin:content-box;background-repeat:no-repeat}
.aside .ql{font-size:calc(var(--k)*26px);font-weight:700;color:var(--ink)}
.split{display:grid;gap:34px;direction:rtl}
.split > div{display:flex;flex-direction:column;gap:30px}
.tips{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);column-gap:56px;row-gap:calc(var(--k)*34px);direction:rtl}
.tip{display:flex;flex-direction:column;gap:14px}
.tip .tt{width:calc(var(--k)*68px);height:calc(var(--k)*68px);background:var(--tile,var(--pillBg));color:var(--tileInk,var(--pillInk));display:flex;align-items:center;justify-content:center;font-size:calc(var(--k)*40px);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.25)}
.tip .tx{font-size:calc(var(--k)*28px);line-height:1.6;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);column-gap:22px;row-gap:calc(var(--k)*58px);direction:rtl;padding-top:40px}
.card{position:relative;background:var(--card);border:1.5px solid var(--cardEdge);box-shadow:var(--cardShadow);border-radius:26px;padding:62px 16px 26px;text-align:center;
  font-weight:700;font-size:calc(var(--k)*25px);line-height:1.45;color:var(--ink)}
.card .cb{position:absolute;top:-42px;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:var(--card);border:1.5px solid var(--cardEdge);
  display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--accent);box-shadow:var(--cardShadow)}
.gold .card .cb{background:#1E1913}
.tracks{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:30px;direction:rtl}
.track{display:flex;gap:18px;align-items:flex-start}
.track .ti2{font-size:calc(var(--k)*70px);color:var(--sub);line-height:1}
.track .tb{border-right:5px solid var(--accent);padding-right:16px}
.track .th{font-weight:800;font-size:calc(var(--k)*36px);color:var(--ink);line-height:1.25}
.track .tt2{font-size:calc(var(--k)*24px);line-height:1.5;color:var(--sub);margin-top:4px}
.panels{display:grid;grid-template-columns:var(--pcols,1.35fr 1fr);gap:20px;direction:rtl}
.panel{background:var(--card);border:1.5px solid var(--cardEdge);border-radius:22px;padding:26px 28px;display:flex;gap:22px;align-items:center;box-shadow:var(--cardShadow)}
.panel .pn{font-weight:900;font-size:calc(var(--k)*150px);line-height:.85;color:var(--ink);font-family:var(--ffNum),var(--ff)}
.gold .panel .pn{background:linear-gradient(180deg,#F8E6BF,#D9B57C 55%,#B8925A);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.panel .pl{font-weight:800;font-size:calc(var(--k)*44px);line-height:1.15;color:var(--ink)}
.panel .pa{font-weight:700;font-size:calc(var(--k)*26px);color:var(--accent);margin-top:6px}
.panel .pt2{font-size:calc(var(--k)*24px);color:var(--sub);line-height:1.45}
.panel .pp{display:flex;flex-direction:column;gap:10px}
.panel .pp span{background:var(--pillBg);color:var(--pillInk);font-weight:800;font-size:calc(var(--k)*24px);padding:8px 22px;text-align:center}
.donut{display:flex;align-items:center;gap:26px;direction:rtl}
.donut svg{flex:0 0 auto}
.donut .dt{font-size:calc(var(--k)*29px);line-height:1.5;color:inherit;font-weight:600}
.before{background:var(--card);border:1.5px solid var(--cardEdge);border-radius:22px;padding:0 30px 26px;box-shadow:var(--cardShadow)}
.before .bt{display:inline-block;background:var(--tagBg,#D9B57C);color:#17130E;font-weight:900;font-size:calc(var(--k)*34px);padding:6px 26px;margin-top:-1px}
.before .bh{font-weight:800;font-size:calc(var(--k)*42px);color:var(--ink);margin-top:16px;line-height:1.25}
.before .bx{font-size:calc(var(--k)*27px);color:var(--sub);margin-top:8px;line-height:1.5}
.gbar{background:linear-gradient(270deg,var(--accent) 0%,var(--accent) 50%,transparent 100%);color:var(--pillInk);font-weight:800;font-size:calc(var(--k)*38px);padding:18px 118px 20px 34px;margin-right:-84px}
.gbar .acc{background:none;-webkit-text-fill-color:currentColor;color:inherit;font-weight:900;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:10px}
.panel .pl .ln{display:block}.panels > *,.split > div,.tips > *,.cards > *{min-width:0}
.fband{position:absolute;left:0;right:0;bottom:0;z-index:13;display:flex;align-items:center;justify-content:space-between;direction:rtl;padding:0 56px;
  background:var(--bandBg);border-top:1.5px solid var(--cardEdge)}
.fband .fl{background-repeat:no-repeat;background-size:contain;background-position:center}
.fband .fc{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:22px;color:var(--ink);direction:ltr;align-items:flex-start}
.fband .fs{display:flex;gap:10px;font-size:26px;color:var(--ink);align-items:center}

/* ═ concept: شخص بطل + عناصر طايرة حوله + نداءات بخطوط منقّطة (مراجع SecDelta/OMK/4mal/Stnamat) ═ */
.fl{position:absolute;transform-origin:center}
.fl.doc{background:#FBF8F1;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.05),0 26px 40px -16px rgba(0,0,0,.6),0 6px 10px rgba(0,0,0,.25);padding:20px 22px 22px;overflow:hidden}
.fl.doc:before{content:"";position:absolute;inset:0;background-image:var(--texUrl);background-size:512px;mix-blend-mode:multiply;opacity:.3}
.fl.doc .dh{font-family:var(--ffH),var(--ff);font-weight:800;color:#2F2A22;line-height:1.25;position:relative}
.fl.doc .de{font-family:var(--ffNum);font-weight:600;color:#8B7F6B;letter-spacing:.5px;direction:ltr;text-align:left;margin-top:2px;position:relative}
.fl.doc .dbar{height:5px;background:#A29265;border-radius:2px;margin:12px 0 10px;width:46%;position:relative}
.fl.doc .dl{height:7px;border-radius:4px;background:#E4DCCB;margin:9px 0;position:relative}
.fl.doc .dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;position:relative}
.fl.doc .dgrid span{height:7px;background:#E9E2D3;border-radius:3px}
.fl .ink{position:absolute;border:4px solid var(--inkc,#9B3A2C);color:var(--inkc,#9B3A2C);font-family:var(--ffH),var(--ff);font-weight:900;
  padding:.04em .4em .1em;border-radius:6px;transform:rotate(-14deg);mix-blend-mode:multiply;opacity:.88;white-space:nowrap;
  -webkit-mask-image:var(--mottleUrl);-webkit-mask-size:300px;mask-image:var(--mottleUrl);mask-size:300px}
.fl.warn{display:flex;align-items:center;gap:16px;background:rgba(20,16,12,.82);border:1.5px solid rgba(206,177,143,.5);border-radius:18px;padding:16px 22px 16px 26px;
  box-shadow:0 24px 40px -18px rgba(0,0,0,.7);backdrop-filter:blur(6px);direction:rtl}
.fl.warn .wi{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--wiBg,#CEB18F);color:#17130E;display:flex;align-items:center;justify-content:center;font-size:32px}
.fl.warn b{display:block;font-family:var(--ffH),var(--ff);font-weight:800;color:#F7EEDB;line-height:1.3}
.fl.warn small{display:block;color:#CFC2A8;line-height:1.4;margin-top:2px}
.fl.note{background:var(--noteBg,#F3DFA8);padding:26px 22px;box-shadow:0 18px 26px -14px rgba(0,0,0,.55);font-family:var(--ffH),var(--ff);font-weight:800;color:#2F2A22;text-align:center;line-height:1.3}
.fl.note:after{content:"";position:absolute;top:-14px;left:50%;width:90px;height:28px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.fl.bubble{border:2.5px solid var(--accent);border-radius:50%;padding:18px 34px;color:var(--ink);font-family:var(--ffH),var(--ff);font-weight:700;white-space:nowrap;
  background:rgba(255,255,255,.04)}
.fl.chk{display:flex;align-items:center;gap:10px;background:var(--pillBg);color:var(--pillInk);border-radius:999px;padding:12px 24px;font-weight:800;box-shadow:var(--pillShadow)}
.fl.mag{pointer-events:none}
.leaders path{fill:none;stroke:var(--line);stroke-width:2.2;stroke-dasharray:3 8;stroke-linecap:round;opacity:.85}
.leaders circle{fill:var(--line)}
.checks{position:absolute;z-index:12;display:flex;gap:14px;justify-content:center;direction:rtl;flex-wrap:wrap}
.checks span{display:inline-flex;align-items:center;gap:10px;background:rgba(206,177,143,.12);border:1.5px solid rgba(206,177,143,.45);color:var(--ink);border-radius:999px;
  padding:10px 22px 12px;font-weight:700;font-size:27px;backdrop-filter:blur(4px)}
.checks span i{color:var(--accent);font-size:30px}
.topline{position:absolute;z-index:20;font-family:var(--ffH),var(--ff);font-weight:800;font-size:30px;color:var(--ink);display:flex;align-items:center;gap:14px;direction:rtl;--k:1}
.topline{flex-direction:column;align-items:flex-start;gap:6px;line-height:1.15}
.topline.stack{gap:2px;padding-right:18px;border-right:4px solid var(--tlBar,#FFFFFF);align-items:flex-start}
.topline.stack .tl{display:block;text-align:right;line-height:1.2}
.topline.stack .tl0{font-weight:500;font-size:26px;opacity:.9}
.topline.stack .tl1{font-weight:800;font-size:36px}
.topline.rule{flex-direction:row}.topline.rule:after{content:"";width:46px;height:3px;border-radius:2px;background:var(--ink);opacity:.7}
.topline .mark{display:inline-block;background:#FFFFFF;color:#2F3033;-webkit-text-fill-color:#2F3033;border-radius:4px;padding:.04em .4em .14em;box-shadow:0 8px 18px -10px rgba(40,30,10,.45);transform:none;clip-path:none;filter:none}
.topline .acc{background:none;-webkit-text-fill-color:currentColor}
.tag-alert{display:inline-flex;align-items:center;gap:12px;background:var(--alertBg,#EFBF04);color:#2F3033;font-family:var(--ffH),var(--ff);font-weight:800;
  padding:.28em .8em .34em;border-radius:6px;box-shadow:0 12px 24px -12px rgba(120,90,0,.6);line-height:1.2}
.tag-alert i{font-size:1.15em}
.glass-tag{position:absolute;z-index:14;display:inline-flex;align-items:center;gap:14px;direction:rtl;white-space:nowrap;
  padding:.38em 1em .44em .55em;border-radius:999px;font-family:var(--ffH),var(--ff);font-weight:800;color:#2F3033;
  background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.22));-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  border:1.5px solid rgba(255,255,255,.75);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 22px 40px -18px rgba(40,30,10,.55)}
.glass-tag .gi{width:1.7em;height:1.7em;border-radius:50%;background:#EFBF04;color:#2F3033;display:inline-flex;align-items:center;justify-content:center;font-size:.9em;
  box-shadow:0 6px 14px -6px rgba(120,90,0,.6)}
.warn-glass{position:absolute;z-index:14;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;direction:rtl}
.warn-glass.side{flex-direction:row;text-align:right;align-items:center}
.wg-tri{position:relative;filter:drop-shadow(0 18px 24px rgba(110,80,0,.45))}
.wg-glass{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,232,140,.72) 0%,rgba(239,191,4,.5) 48%,rgba(226,170,0,.38) 100%);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.wg-glass:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%),radial-gradient(60% 40% at 50% 0%,rgba(255,255,255,.5),transparent 70%)}
.wg-tri svg{position:absolute;inset:0;overflow:visible}
.wg-ex{position:absolute;left:0;right:0;text-align:center;font-family:var(--ffH),var(--ff);font-weight:900;color:#2F3033;line-height:1}
.wg-t{display:flex;flex-direction:column;gap:2px;font-family:var(--ffH),var(--ff);color:var(--ink);line-height:1.2}
.wg-t.wg-in{position:absolute;left:0;right:0;align-items:center;color:#2F3033;gap:0;line-height:1.15}
.wg-t.wg-in span{font-weight:700 !important}.wg-t.wg-in .wg-l0{font-weight:900 !important}
.wg-t .wg-l0{font-weight:800;font-size:34px}
.wg-t span:not(.wg-l0){font-weight:600;font-size:25px}
/* صندوق زجاجي لـ«قبل ما تقرأ هذا» */
.title.cbox.glassy{background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.18)) !important;color:#2F3033 !important;-webkit-text-fill-color:#2F3033 !important;
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1.5px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 16px 30px -16px rgba(40,30,10,.45);border-radius:12px !important}
.phone-line{position:absolute;z-index:20;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;direction:ltr;
  font-family:var(--ffNum),var(--ff);font-weight:500;font-size:31px;color:var(--ink);letter-spacing:1px}

  background:var(--fbBg,rgba(247,238,219,.96));color:#17130E;border-radius:999px;padding:12px 16px 12px 30px;box-shadow:0 18px 30px -16px rgba(0,0,0,.6)}

/* ═ زجاج (glassmorphism) — يبين اللي خلفه مموّه + حافة ضوئية ═ */
.glass{position:absolute;overflow:hidden;
  background:linear-gradient(140deg,rgba(255,255,255,var(--ga1,.30)) 0%,rgba(255,255,255,var(--ga2,.08)) 55%,rgba(255,255,255,var(--ga3,.16)) 100%);
  -webkit-backdrop-filter:blur(var(--gb,16px)) saturate(1.25);backdrop-filter:blur(var(--gb,16px)) saturate(1.25);
  border:1.5px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.18),0 34px 60px -30px rgba(50,38,12,.5)}
.glass:before{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.32) 48%,transparent 56%);pointer-events:none}
.glass:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(70% 50% at 20% 0%,rgba(255,255,255,.35),transparent 70%);pointer-events:none}
.bgph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
/* ═ أخبار وتعاميم ═ */
.ncard{display:flex;gap:22px;align-items:flex-start;background:var(--card);border:1.5px solid var(--cardEdge);border-radius:22px;padding:26px 26px 28px;direction:rtl;
  box-shadow:var(--cardShadow)}
.ncard + .ncard{margin-top:0}
.ncard .nb{flex:0 0 auto;min-width:3.6em;text-align:center;box-sizing:border-box;background:var(--pillBg);color:var(--pillInk);-webkit-text-fill-color:var(--pillInk);font-family:var(--ffH),var(--ff);font-weight:800;
  font-size:calc(var(--k)*28px);padding:.18em .7em .26em;border-radius:10px;line-height:1.2;margin-top:4px}
.ncard .nt{font-size:calc(var(--k)*30px);line-height:1.75;color:var(--ink);text-align:right}
.ncard .nt b{color:var(--accent);-webkit-text-fill-color:var(--accent);font-weight:700}
.regions{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:12px 14px;direction:rtl}
.rg{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1.5px solid var(--cardEdge);border-radius:14px;padding:12px 16px 14px 14px}
.rg .rn{font-family:var(--ffH),var(--ff);font-weight:700;font-size:calc(var(--k)*28px);color:var(--ink);line-height:1.3}
.rg .rc{flex:0 0 auto;background:rgba(206,177,143,.16);color:var(--accent);-webkit-text-fill-color:var(--accent);font-weight:700;font-size:calc(var(--k)*24px);
  border-radius:999px;padding:.12em .7em .2em;border:1px solid rgba(206,177,143,.4)}
.meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;direction:rtl}
.meta .md{display:inline-flex;align-items:center;gap:10px;background:var(--pillBg);color:var(--pillInk);-webkit-text-fill-color:var(--pillInk);font-weight:700;
  font-size:calc(var(--k)*27px);padding:.2em .8em .28em;border-radius:10px}
.meta .ms{font-size:calc(var(--k)*25px);color:var(--sub);font-weight:600}
.meta .me{font-size:calc(var(--k)*25px);color:var(--sub);font-weight:600;margin-right:auto}
.pager{position:absolute;z-index:20;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;direction:var(--pagerDir,ltr)}
.pager i{width:11px;height:11px;border-radius:50%;background:var(--ink);opacity:.28}
.pager i.on{width:34px;border-radius:999px;background:var(--accent);opacity:1}
.pager.boxed{left:50%;right:auto;transform:translateX(-50%);gap:14px;padding:14px 22px;border-radius:999px;
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.16));-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  border:1.5px solid rgba(255,255,255,.75);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 12px 26px -14px rgba(40,30,15,.45)}
.gold .pager.boxed{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border-color:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 26px -14px rgba(0,0,0,.6)}
.pager.boxed i{width:13px;height:13px;opacity:.35}
.pager.boxed i.on{width:42px;opacity:1}
.src-line{position:absolute;z-index:20;left:80px;right:80px;text-align:center;font-size:22px;font-weight:500;color:var(--sub);opacity:.8;white-space:nowrap}
.divider{display:flex;align-items:center;gap:12px;direction:rtl}
.divider span{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--line))}
.divider span:last-child{background:linear-gradient(270deg,transparent,var(--line))}
.divider i{width:12px;height:12px;background:var(--accent);transform:rotate(45deg);border-radius:2px}
.ctx{display:flex;align-items:center;justify-content:space-between;gap:16px;direction:rtl;padding-bottom:0;margin-top:22px}
.sec:has(> .ctx) + .sec{margin-top:calc(var(--k)*12px)}
.ctx span{font-family:var(--ffH),var(--ff);font-weight:500;font-size:calc(var(--k)*27px);color:var(--accent);-webkit-text-fill-color:var(--accent)}
.ctx b{flex:0 0 auto;font-family:var(--ffNum),var(--ff);font-weight:700;font-size:calc(var(--k)*24px);color:var(--sub);direction:ltr;
  border:1.5px solid var(--cardEdge);border-radius:999px;padding:.1em .7em .16em}
/* ═ صورة تعريفية ═ */
.nameplate{position:absolute;z-index:16;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:20px 54px 24px;border-radius:28px;white-space:nowrap;direction:rtl;
  background:linear-gradient(160deg,rgba(38,39,42,.72),rgba(20,21,23,.86));-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);

.np-name{font-family:var(--ffH),var(--ff);font-weight:800;font-size:56px;color:#F7EEDB;line-height:1.2}

/* ═ صورة تعريفية (profile) ═ */

.pf-box{display:inline-block;padding:.22em .8em .3em;border-radius:8px}
.pf-arch{position:absolute;z-index:5;overflow:hidden;background:radial-gradient(70% 55% at 50% 38%,#4A4232 0%,#2C2A25 55%,#1C1B19 100%);

.pf-echo{position:absolute;left:0;right:0;z-index:3;text-align:center;font-family:var(--ffH),var(--ff);font-weight:900;font-size:430px;line-height:1;
  color:transparent;-webkit-text-stroke:2.5px rgba(162,146,101,.55);background:linear-gradient(180deg,rgba(162,146,101,.16),rgba(162,146,101,0));-webkit-background-clip:text;background-clip:text}
.pf-panel{position:absolute;z-index:2}
.pf-lanyard{position:absolute;z-index:3;width:44px;background:linear-gradient(90deg,#8E7F55,#CEB18F 50%,#8E7F55);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.pf-card{position:absolute;z-index:5;background:#FBFAF7;border-radius:36px;box-shadow:0 50px 80px -40px rgba(0,0,0,.55),0 8px 20px rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;overflow:hidden}
.pf-card:before{content:"";position:absolute;inset:0;background-image:var(--texUrl);background-size:512px;mix-blend-mode:multiply;opacity:.18;pointer-events:none}

  background:radial-gradient(80% 70% at 50% 35%,#C8B78C 0%,#A29265 60%,#8A7B52 100%)}
.pf-cname{font-family:var(--ffH),var(--ff);font-weight:800;font-size:58px;color:#2F3033;margin-top:30px;line-height:1.2}

.pf-glass{background:linear-gradient(135deg,rgba(255,255,255,var(--pgA,.26)),rgba(255,255,255,var(--pgB,.08)));color:var(--ink);-webkit-text-fill-color:var(--ink);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1.5px solid rgba(255,255,255,var(--pgE,.45));
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 16px 30px -16px rgba(0,0,0,.45);border-radius:14px;padding:.26em 1em .3em}
.pf-echo2{position:absolute;left:0;right:0;z-index:3;text-align:center;font-family:var(--ffH),var(--ff);font-weight:900;line-height:1;color:transparent;-webkit-background-clip:text;background-clip:text;white-space:nowrap}
.pf-dv{display:flex;align-items:center;gap:10px;width:260px;margin:6px 0 12px}
.pf-dv span{flex:1;height:1.5px;background:linear-gradient(90deg,transparent,var(--accent))}.pf-dv span:last-child{background:linear-gradient(270deg,transparent,var(--accent))}
.pf-dv i{width:9px;height:9px;background:var(--accent);transform:rotate(45deg)}
/* ═ أقسام كاروسيل رايق ═ */
.duo.open{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:0 34px;align-items:start}
.duo.open .duo-c{background:none;border:none;box-shadow:none;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.duo.open .duo-h{margin:0}
.duo.open .duo-t{color:var(--sub)}
.duo-i.big{width:calc(var(--k)*92px);height:calc(var(--k)*92px);font-size:calc(var(--k)*46px);background:var(--card,#fff);color:var(--accent);
  border:1.5px solid var(--cardEdge);box-shadow:0 18px 34px -18px rgba(80,65,30,.45)}
.duo-sep{display:block;width:1.5px;align-self:stretch;background:linear-gradient(180deg,transparent,var(--accent) 20%,var(--accent) 80%,transparent);opacity:.55}
/* ترميز لوني ثابت للطرفين (tone): a = ذهبي الهوية (الخيار الأول)، b = رمادي الهوية (الخيار الثاني) — يتكرر بكل الشرائح */
.duo-c.tone-a .duo-i.big,.duo-c.tone-b .duo-i.big{color:#fff;border-color:transparent}
.duo-c.tone-a .duo-i.big{background:var(--toneA,#A29265);box-shadow:0 18px 34px -16px rgba(130,105,50,.6)}
.duo-c.tone-b .duo-i.big{background:var(--toneB,#6D6E71);box-shadow:0 18px 34px -16px rgba(40,40,45,.5)}
.duo-c.tone-a .duo-h b{color:var(--toneAInk,#857347)}
.duo-c.tone-b .duo-h b{color:var(--toneBInk,#55565A)}
/* جدول مقارنة رايق (table): رأس بكبسولتين ملوّنتين + صفوف بخطوط فاصلة + ✓/✗ أو نص */
.tbl{display:flex;flex-direction:column;align-self:stretch;direction:rtl}
.tbl .tr{display:grid;grid-template-columns:var(--tlw,1.05fr) repeat(var(--tn,2),minmax(0,1fr));align-items:center;gap:0 22px;padding:calc(var(--k)*20px) 6px;border-bottom:1.5px solid var(--cardEdge)}
.tbl .tr:last-child{border-bottom:none}
.tbl .tr.th{padding-top:0;padding-bottom:calc(var(--k)*18px);border-bottom:2px solid var(--accent)}
.tbl .tc{justify-self:center;font-family:var(--ffH),var(--ff);font-weight:800;font-size:calc(var(--k)*var(--tcfs,30px));color:#fff;padding:.18em .85em .28em;border-radius:999px;white-space:nowrap;line-height:1.25}
.tbl .tc.a{background:var(--toneA,#A29265)}.tbl .tc.b{background:var(--toneB,#6D6E71)}
.tbl .tl{white-space:nowrap;font-family:var(--ffH),var(--ff);font-weight:800;font-size:calc(var(--k)*var(--tlfs,29px));color:var(--ink);line-height:1.35;text-align:right}
.tbl .td{text-align:center;font-size:calc(var(--k)*var(--tdfs,27px));line-height:1.45;color:var(--sub);font-weight:500;text-wrap:balance}
.tbl .td i{font-size:calc(var(--k)*50px);display:inline-block;line-height:1}
.tbl .td.a i{color:var(--toneA,#A29265)}.tbl .td.b i{color:var(--toneB,#6D6E71)}
.tbl .td i.no{color:#B9B6AE !important}
.tbl .td b{color:var(--ink);font-weight:700}
/* جدول بأعمدة ملوّنة (style:"tint") — كل عمود كتلة واضحة تحت عنوانه */
.tbl.tint .tr{border-bottom:none;padding:calc(var(--k)*7px) 0;gap:0 14px}
.tbl.tint .tr.th{border-bottom:none;padding-bottom:calc(var(--k)*6px)}
.tbl.tint .tc{justify-self:stretch;text-align:center;border-radius:16px 16px 6px 6px;padding:.3em .4em .38em}
.tbl.tint .td{align-self:stretch;display:flex;align-items:center;justify-content:center;padding:calc(var(--k)*30px) 14px;border-radius:6px;color:var(--ink);font-weight:600}
.tbl.tint .td.a{background:rgba(140,115,75,.17)}.tbl.tint .td.b{background:rgba(109,110,113,.13)}
.tbl.tint .tr:last-child .td{border-radius:6px 6px 16px 16px}
.tbl.tint .tl{align-self:center}
.chipsx.stack{flex-direction:column;align-items:center;gap:20px}
.chipsx span{font-size:calc(var(--k)*var(--cfs,34px))}
.reqs.big{gap:0}

.reqs.big .req:last-child{border-bottom:none}

.reqs.big .rq-t{font-size:calc(var(--k)*34px);font-weight:600}
.body p,.duo-t,.rq-t,.hl-n,.pt-t,.tip .tx,.ncard .nt,.blk .tx,.faq-a{text-wrap:pretty}
.title .ln,.h2,.duo-h b{text-wrap:balance}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;direction:rtl;align-self:stretch;text-align:right}
.duo-c{background:rgba(255,255,255,.72);border:1.5px solid rgba(255,255,255,.9);border-radius:24px;padding:24px 26px 26px;
  box-shadow:0 18px 36px -22px rgba(80,65,30,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.duo-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.duo-h b{font-family:var(--ffH),var(--ff);font-weight:800;font-size:calc(var(--k)*31px);color:var(--ink);line-height:1.25;white-space:nowrap}

.duo-t{font-size:calc(var(--k)*27px);line-height:1.6;color:var(--sub)}
.chipsx{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;direction:rtl}
.chipsx span{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,.75);border:1.5px solid rgba(255,255,255,.95);border-radius:999px;
  padding:.3em 1.1em .38em .9em;font-family:var(--ffH),var(--ff);font-weight:700;font-size:calc(var(--k)*34px);color:var(--ink);box-shadow:0 14px 30px -18px rgba(80,65,30,.45)}
.chipsx span i{color:var(--accent);font-size:1.1em}
.hl{display:flex;flex-direction:column;align-items:center;gap:16px}

.kicker:before{content:"";width:46px;height:3px;background:var(--accent);border-radius:2px}
.body{font-size:calc(var(--k)*var(--fsb,33px));font-weight:400;line-height:1.62;color:var(--sub);max-width:var(--bodyW,840px)}
.body p+p{margin-top:.55em}
.body b,.body strong{font-weight:700;color:var(--ink)}
.pill{display:inline-block;background:var(--pillBg);color:var(--pillInk);font-weight:700;font-size:calc(var(--k)*31px);
  line-height:1.35;padding:.32em .9em .38em;border-radius:999px;box-shadow:var(--pillShadow)}
.pill.light{background:var(--pill2Bg);color:var(--pill2Ink);box-shadow:var(--pill2Shadow)}
.bar{align-self:stretch;text-align:center;background:var(--pill2Bg);color:var(--pill2Ink);font-weight:800;
  font-size:calc(var(--k)*var(--fsh,46px));line-height:1.3;padding:.36em .7em .42em;border-radius:26px;box-shadow:var(--pill2Shadow);
  border:1.5px solid var(--barEdge)}
.h2{font-weight:var(--wTitle);font-size:calc(var(--k)*var(--fsh,62px));line-height:1.25;color:var(--ink)}
.rule{align-self:stretch;height:2px;background:var(--line);opacity:.55;margin:0 60px}
.gap-s{height:calc(var(--k)*18px)}.gap{height:calc(var(--k)*36px)}.gap-l{height:calc(var(--k)*64px)}
.blk{max-width:var(--bodyW,860px)}
.blk .lb{font-weight:800;font-size:calc(var(--k)*36px);color:var(--ink);line-height:1.3;margin-bottom:6px}
.blk .tx{font-size:calc(var(--k)*31px);line-height:1.58;color:var(--sub)}
.blk + .blk{margin-top:calc(var(--k)*30px)}

/* رقم الدائرة النازفة */
.num{position:absolute;z-index:9;border-radius:50%;background:var(--numBg);box-shadow:inset 0 -14px 40px rgba(0,0,0,.08)}
.num span{position:absolute;font-weight:900;color:var(--numInk);line-height:1;font-family:var(--ffNum),var(--ff)}

/* قوائم */
.list{list-style:none;font-size:calc(var(--k)*33px);line-height:1.5;color:var(--ink);font-weight:500}
.list li{display:flex;align-items:flex-start;gap:16px}
.list li + li{margin-top:calc(var(--k)*14px)}
.list .dot{flex:0 0 auto;width:calc(var(--k)*40px);height:calc(var(--k)*40px);border-radius:50%;background:var(--pillBg);color:var(--pillInk);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--k)*22px);margin-top:calc(var(--k)*5px)}
.list .ic{flex:0 0 auto;font-size:calc(var(--k)*40px);color:var(--accent);line-height:1.15}
.list.plain li:before{content:"";flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:calc(var(--k)*18px)}
.box{background:var(--pillBg);color:var(--pillInk);border-radius:28px;padding:calc(var(--k)*30px) calc(var(--k)*40px);box-shadow:var(--pillShadow)}
.box .list{color:var(--pillInk)}
.box .list .dot{background:var(--pillInk);color:var(--pillBg)}

.chips{display:flex;flex-wrap:wrap;gap:calc(var(--k)*16px);max-width:900px}
.chips .pill{font-size:calc(var(--k)*32px)}
.tiles{display:flex;flex-wrap:wrap;gap:18px;direction:rtl}
.tile{background:var(--pill2Bg);border-radius:20px;padding:22px 16px;min-width:150px;text-align:center;font-weight:700;font-size:calc(var(--k)*25px);
  color:var(--pill2Ink);box-shadow:var(--pill2Shadow);line-height:1.3}

/* مقارنة */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-self:stretch}
.cmp .col{background:var(--card);border-radius:28px;padding:30px 30px 34px;box-shadow:var(--cardShadow);border:1.5px solid var(--cardEdge)}
.cmp .col.dark{background:var(--pillBg);color:var(--pillInk)}
.cmp .col h3{font-size:calc(var(--k)*38px);font-weight:800;line-height:1.25;margin-bottom:18px}
.cmp .col ul{list-style:none;font-size:calc(var(--k)*28px);line-height:1.45}
.cmp .col li{display:flex;gap:10px;align-items:flex-start}.cmp .col li+li{margin-top:12px}
.cmp .col li i{font-size:calc(var(--k)*30px);color:var(--accent);margin-top:4px}
.cmp .col.dark li i{color:var(--pill2Bg)}
.verdict{margin-top:26px}

/* أرقام */
.stats{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:20px;align-self:stretch;direction:rtl}
.stat{background:var(--card);border-radius:26px;padding:26px 14px 24px;text-align:center;box-shadow:var(--cardShadow);border:1.5px solid var(--cardEdge)}
.stat .n{font-weight:900;font-size:calc(var(--k)*58px);line-height:1.05;color:var(--ink);direction:ltr;font-family:var(--ffNum),var(--ff)}
.stats.open .stat{background:none;border:none;box-shadow:none;border-top:2px solid var(--cardEdge);border-radius:0;text-align:right;padding:24px 4px 0}
.stats.open .stat .n{font-size:calc(var(--k)*84px)}
.stat .l{font-weight:700;font-size:calc(var(--k)*26px);color:var(--sub);margin-top:8px;line-height:1.3}

/* خطوات */
.steps{list-style:none;align-self:stretch;position:relative}
.steps li{display:flex;gap:26px;align-items:flex-start;position:relative}
.steps li + li{margin-top:calc(var(--k)*34px)}
.steps .sn{flex:0 0 auto;width:calc(var(--k)*74px);height:calc(var(--k)*74px);border-radius:50%;background:var(--pillBg);color:var(--pillInk);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--k)*34px);position:relative;z-index:2;box-shadow:var(--pillShadow)}
.steps li:not(:last-child) .sn:after{content:"";position:absolute;top:100%;left:50%;width:2px;height:calc(var(--k)*200px);
  background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 16px);opacity:.6;transform:translateX(-50%);z-index:-1}
.steps .st{font-weight:800;font-size:calc(var(--k)*36px);line-height:1.3;color:var(--ink)}
.steps .sd{font-size:calc(var(--k)*28px);line-height:1.5;color:var(--sub);margin-top:4px}

/* سؤال شائع */
.tag{display:inline-flex;align-items:center;gap:10px;background:var(--pill2Bg);color:var(--pill2Ink);border:1.5px solid var(--cardEdge);
  font-weight:700;font-size:calc(var(--k)*26px);padding:.3em .9em;border-radius:12px}
.faq-q{display:flex;gap:28px;align-items:flex-start;align-self:stretch}
.faq-q .qi{flex:0 0 auto;font-size:calc(var(--k)*150px);line-height:1;color:var(--ink);opacity:.85}
.faq-a{font-size:calc(var(--k)*34px);line-height:1.6;color:var(--sub);border-right:4px solid var(--accent);padding-right:24px;max-width:860px}

/* تواصل */
.contact{position:absolute;z-index:11;display:flex;align-items:center;gap:22px;direction:ltr}
.contact .ring{flex:0 0 auto;width:86px;height:86px;border-radius:50%;border:3.5px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.contact .ring i{font-size:48px}
.contact .nums{display:flex;flex-direction:column;gap:2px}
.contact .ph{font-weight:600;font-size:40px;line-height:1.12;color:var(--ink);letter-spacing:.5px;font-family:var(--ffNum),var(--ff);display:flex;gap:14px;align-items:baseline;direction:ltr}
.contact .ph em{font-style:normal;font-size:22px;font-weight:700;color:var(--sub);direction:rtl}
.contact-wrap{position:absolute;z-index:11;display:flex;flex-direction:column;align-items:center;gap:14px}
.contact-wrap .pre{font-size:25px;font-weight:600;color:var(--sub);direction:rtl}
.contact-wrap .web{font-size:24px;font-weight:600;color:var(--sub);letter-spacing:.5px;direction:ltr}
.contact-wrap .contact{position:static}

/* شريط الفوتر (ثيم classic من دليل الهوية) */
.band{position:absolute;left:0;right:0;bottom:0;z-index:12;background:var(--bandBg);color:#fff;display:flex;align-items:center;justify-content:space-between;
  direction:ltr;padding:0 70px;font-weight:700;font-size:25px}
.band .it{display:flex;align-items:center;gap:10px}.band i{font-size:30px}

/* عناصر مرسومة بالكود (props) — ورق، بطاقة، ختم، قائمة */
.prop{position:absolute;z-index:8}
.paper{background:#FBF7EE;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 22px 40px -12px rgba(60,40,15,.45),0 4px 8px rgba(60,40,15,.18);overflow:hidden}
.paper:before{content:"";position:absolute;inset:0;background-image:var(--texUrl);background-size:512px;mix-blend-mode:multiply;opacity:.25}
.paper .hd{font-weight:700;color:#6b5b3d;text-align:center}
.paper .ln{height:9px;border-radius:4px;background:#E2DACB;margin:12px 0}
.paper .frame{position:absolute;inset:16px;border:1.5px solid #CBB98F;border-radius:3px}
.paper .frame:after{content:"";position:absolute;inset:6px;border:1px solid #DCCDA9}
.idc{border-radius:26px;background:linear-gradient(135deg,#F1E6CF 0%,#E2D2AE 45%,#CDBA8E 100%);box-shadow:0 24px 40px -14px rgba(50,34,10,.55),0 3px 6px rgba(50,34,10,.25),inset 0 1px 0 rgba(255,255,255,.6);overflow:hidden}
.idc:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.18) 14px 15px)}
.idc .ph{position:absolute;border-radius:12px;background:linear-gradient(#cfc3a8,#b9aa86)}
.idc .ph:after{content:"";position:absolute;left:50%;top:22%;width:44%;height:44%;transform:translateX(-50%);border-radius:50%;background:#a7966f;
  box-shadow:0 70px 0 18px #a7966f}
.idc .chip{position:absolute;border-radius:9px;background:linear-gradient(135deg,#e7cf8f,#b8954d);box-shadow:inset 0 0 0 2px rgba(120,90,30,.35)}
.stamp{border-radius:50%;opacity:.86;mix-blend-mode:multiply}
.sketch{position:absolute;inset:0;z-index:15;pointer-events:none}
.bgonly .content,.bgonly .contact,.bgonly .contact-wrap,.bgonly .sketch,.bgonly .swipe,.bgonly .band .it{visibility:hidden}
</style>

/* ═════════ كشيدة (مدّ الحروف) بأسلوب المصمم ═════════
   data-kashida = "justify" (كل الأسطر بعرض الأعرض) · "auto" (justify للمتعدد، 1.18 للسطر الواحد) · رقم (نسبة مدّ) ·
   و =كلمة= بالنص = مدّ كلمة وحدة بقوة. المدّ يروح لأجمل موضع: قبل آخر حرف، أو بعد الحروف المسطّحة (س ش ص ض ط ظ)،
   وما يكسر «لا» ولا «الـ» ولا لفظ الجلالة، وحدّه موضعين بالسطر (زي شغل الخطاطين، مو تمطيط موزّع على كل حرف). */

    const prev = lns.map(l => l.style.display);
